name: FastAPI Kotlin E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recursively
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify pinned source revisions
        run: |
          python -m json.tool opto-sync-pin.json >/dev/null
          test "$(git -C vendor/opto-sync-clients rev-parse HEAD)" = "$(python -c 'import json; print(json.load(open("opto-sync-pin.json"))["clientsCommit"])')"
          test "$(git -C vendor/opto-sync-clients/syncer.c rev-parse HEAD)" = "$(python -c 'import json; print(json.load(open("opto-sync-pin.json"))["coreCommit"])')"

      - name: Install and test FastAPI
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python server/build_core.py
          python -m pytest -q server/tests

      - name: Test the official Kotlin client across HTTP
        run: |
          python -m uvicorn server.app:app --host 127.0.0.1 --port 8061 > /tmp/fastapi-kotlin-e2e.log 2>&1 &
          fastapi_e2e_pid=$!
          trap 'kill "$fastapi_e2e_pid"' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8061/health >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:8061/health
          cd kotlin
          ./gradlew test --no-daemon
